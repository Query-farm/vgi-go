name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# vgi-go's CI covers formatting, vet, lint, the worker build, and the pure-Go
# unit tests. The integration suite (make test / test-http / test-shm) needs a
# built DuckDB VGI extension, which is produced by the dedicated extension-build
# pipeline in the Query-farm/vgi repo (vcpkg + duckdb extension-ci-tools). It is
# run there and locally rather than rebuilt from scratch here.
jobs:
  lint:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: make vet

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          # only-new-issues: the repo has pre-existing lint debt that predates CI
          # ever running golangci-lint (the workflow failed earlier, at checkout,
          # before this step). Gate on issues introduced by the change under test
          # so new code stays clean while the backlog is paid down separately.
          only-new-issues: true

      - name: Build
        run: make build

      # The core SDK must stay cgo-free; only vgi/exprduckdb embeds DuckDB.
      - name: Build core SDK without cgo
        run: |
          CGO_ENABLED=0 go build ./vgi/ ./vgi/vgitest/
          if go list -deps ./vgi/ | grep -q haybarn; then echo "vgi imports haybarn" >&2; exit 1; fi

      # The externalizing-storage tests (vgi/storage_blobs_test.go) run against
      # vgi-rpc-python's fake blob vendor, the same build the extension's
      # test/start_fake_blob_vendor.sh pins.
      - uses: astral-sh/setup-uv@v6

      - name: Unit tests with coverage
        env:
          VGI_RPC_FAKE_VENDOR_CMD: uvx --from git+https://github.com/Query-farm/vgi-rpc-python@6a21ee3b2fb21d9c348c9b615fd97dce8e0bb852 vgi-rpc-fake-vendor
        run: make test-unit

      - name: Verify consumer FlatBuffers replacement
        run: ci/check-consumer-flatbuffers.sh

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn

  # vgi-rpc's hosted-protocols conformance group against the example worker:
  # conformance.Secondary.v1 hosted through vgi.WithHostedProtocols on stdio,
  # unix and HTTP, and vgi_rpc.Identity.v2 (vgi.WithIdentity) over HTTP. The
  # reference is unpinned main by design, as in the port CI: a reference change
  # that breaks this SDK turns it red the same day.
  hosted-protocols:
    name: Hosted protocols (vgi-rpc conformance)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Clone vgi-rpc-python reference
        # TODO(release-wave): back to main (unpinned) once protocol-3.4 is merged.
        run: git clone --depth 1 --branch protocol-3.4 https://github.com/Query-farm/vgi-rpc-python.git "$RUNNER_TEMP/vgi-rpc-python"

      - name: Install the reference's conformance suite
        run: |
          python -m pip install --upgrade pip
          pip install "${RUNNER_TEMP}/vgi-rpc-python[http,conformance]" pytest pytest-timeout

      - name: Build example worker
        run: make build

      - name: Hosted-protocols group (stdio, unix, HTTP + identity)
        env:
          PYTHON: python
        run: timeout 600 ci/run-hosted-protocols.sh
