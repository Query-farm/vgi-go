# Runs the canonical Query-farm/vgi integration sqllogictest suite against the Go
# example worker on every push / PR. Rather than building the C++ extension from
# source in each SDK job, it downloads a native runner built at the same pinned
# commit as the .test files. The runner already links the development extension.
# The .test files come from Query-farm/vgi; ci/run-integration.sh
# + ci/preprocess-require.awk stage the selected transport lane. See ci/README.md.
name: Integration suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test sources and statically linked binaries come from this exact native commit.
  VGI_REF: 3a2249f815ff6e2a8b5289a3e6284326084e3630

jobs:
  build-worker:
    name: Build workers once
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vgi-go
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build example workers (coverage-instrumented)
        run: make build COVER=1

      # Archive before upload because upload-artifact does not preserve the
      # executable bit required by subprocess and launcher transports.
      - name: Package workers
        run: |
          tar -czf vgi-go-workers.tar.gz \
            vgi-example-worker-go \
            vgi-example-versioned-worker-go \
            vgi-example-versioned-tables-worker-go \
            vgi-example-attach-options-worker-go \
            vgi-example-simple-writable-worker-go

      - name: Upload workers
        uses: actions/upload-artifact@v4
        with:
          name: vgi-go-workers-${{ github.sha }}
          path: vgi-go-workers.tar.gz
          if-no-files-found: error
          retention-days: 1

  integration:
    needs: build-worker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # stdio:  the subprocess transport (whole suite — the primary lane).
          # launch: the whole suite over the AF_UNIX launcher transport.
          # shm:    launch + the POSIX shared-memory side channel. Rides the
          #         launcher, not raw subprocess: stdio already covers the
          #         fork-per-connection path and spends most of its wall-clock
          #         doing it, so re-paying that cost to test shm is waste.
          # http:   the whole suite over the stateless HTTP transport.
          - { lane: stdio }
          - { lane: launch }
          - { lane: shm, shm_bytes: '67108864' }
          - { lane: http }
    name: integration (${{ matrix.lane }})
    steps:
      - name: Checkout vgi-go
        uses: actions/checkout@v4

      - name: Checkout current vgi test suite
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi
          ref: ${{ env.VGI_REF }}
          path: vgi-upstream
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Download workers
        uses: actions/download-artifact@v4
        with:
          name: vgi-go-workers-${{ github.sha }}

      - name: Extract workers
        run: tar -xzf vgi-go-workers.tar.gz

      - name: Download native runner matching the test suite
        run: |
          python3 "$VGI_SRC/scripts/ci_fetch_native_runner.py" \
            --source "$VGI_SRC" --output "$RUNNER_TEMP/vgi-native"
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
          GH_TOKEN: ${{ github.token }}

      - name: Run integration suite (${{ matrix.lane }})
        run: ci/run-integration.sh
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
          TRANSPORT: ${{ matrix.lane }}
          # Empty on every lane except shm; run-integration.sh drops an empty value.
          VGI_RPC_SHM_SIZE_BYTES: ${{ matrix.shm_bytes || '' }}
          # Collect worker coverage for this lane (the workers are -cover binaries;
          # see Makefile COVER=1 / ci/run-integration.sh). Each lane writes its pods
          # to a lane-specific dir, uploaded below and merged in the coverage job.
          COVERAGE: '1'
          GOCOVERDIR: ${{ github.workspace }}/covdata-${{ matrix.lane }}

      - name: Upload coverage pods (${{ matrix.lane }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: covdata-${{ matrix.lane }}
          path: covdata-${{ matrix.lane }}
          if-no-files-found: warn

  coverage:
    name: coverage (merge lanes)
    needs: integration
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Download all lane coverage pods
        uses: actions/download-artifact@v4
        with:
          pattern: covdata-*
          path: covdata

      - name: Merge + report worker integration coverage
        run: |
          dirs=$(find covdata -mindepth 1 -maxdepth 1 -type d | paste -sd, -)
          [ -n "$dirs" ] || { echo "::warning::no coverage pods to merge"; exit 0; }
          mkdir -p merged
          go tool covdata merge -i="$dirs" -o merged
          go tool covdata textfmt -i=merged -o coverage-integration.txt
          echo '### Worker integration coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool covdata percent -i=merged >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool covdata percent -i=merged

      - name: Upload merged coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage-integration.txt
          if-no-files-found: warn
